name: Build & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Modrinth"
        type: boolean
        default: true

env:
  MIN_GAME_VERSION: "1.20.1"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve version info from tag
        id: ver
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          if echo "$RAW" | grep -qi "alpha"; then
            echo "type=alpha" >> "$GITHUB_OUTPUT"
          elif echo "$RAW" | grep -qi "beta"; then
            echo "type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Minecraft version range
        id: versions
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          def get_json(url):
              with urllib.request.urlopen(url) as r:
                  return json.load(r)

          def parse(v):
              parts = []
              for p in v.split("."):
                  if p.isdigit():
                      parts.append(int(p))
                  else:
                      return None
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          min_v = parse(os.environ["MIN_GAME_VERSION"])

          manifest = get_json("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
          latest_release = manifest["latest"]["release"]
          latest_v = parse(latest_release)

          tags = get_json("https://api.modrinth.com/v2/tag/game_version")
          versions = []
          for t in tags:
              if t.get("version_type") != "release":
                  continue
              v = parse(t["version"])
              if v is None:
                  continue
              if min_v <= v <= latest_v:
                  versions.append(t["version"])

          versions = sorted(set(versions), key=parse)
          if not versions:
              versions = [os.environ["MIN_GAME_VERSION"], latest_release]

          print("Resolved game versions:", ", ".join(versions))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("list<<EOF\n")
              f.write("\n".join(versions))
              f.write("\nEOF\n")
              f.write(f"latest={latest_release}\n")
          PY

      - name: Resolve Simple Voice Chat project ID
        id: svc
        run: |
          ID=$(curl -sS https://api.modrinth.com/v2/project/simple-voice-chat | jq -r '.id')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Simple Voice Chat project id: $ID"

      - name: Set project version from tag
        run: mvn -B versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build with Maven
        run: |
          n=0
          until mvn -B clean package; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "Maven build failed after 3 attempts, giving up."
              exit 1
            fi
            echo "Maven build failed (attempt $n/3), retrying in 20s..."
            sleep 20
          done

      - name: Package per-loader jars
        id: pkg
        run: |
          mkdir -p dist
          SRC=$(find target -maxdepth 1 -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -n1)
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          VERSION="${{ steps.ver.outputs.version }}"
          while IFS= read -r MCVER; do
            [ -z "$MCVER" ] && continue
            for LOADER in paper purpur spigot bukkit folia; do
              OUT="dist/vgcleaner-${LOADER}-${VERSION}+mc${MCVER}.jar"
              cp "$SRC" "$OUT"
              printf "loader=%s\nversion=%s\nmc=%s\n" "$LOADER" "$VERSION" "$MCVER" > loader-marker.txt
              zip -q "$OUT" loader-marker.txt
              rm loader-marker.txt
            done
          done <<< "${{ steps.versions.outputs.list }}"
          echo "Built $(ls dist | wc -l) jars:"
          ls dist

      - name: Build changelog & subtitle
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          MIN="${{ env.MIN_GAME_VERSION }}"
          LATEST="${{ steps.versions.outputs.latest }}"

          BODY=$(awk '/^## /{if (seen) exit; seen=1; next} seen' CHANGELOG.md | sed '/^$/d')

          {
            echo "notes<<EOF"
            echo "> **VoiceGroupCleaner ${VERSION}**"
            echo ">"
            echo "> Supports **Paper**, **Purpur**, **Spigot**, **Bukkit**, and **Folia**, Minecraft **${MIN}** to **${LATEST}**."
            echo ">"
            echo "$BODY" | sed 's/^/> /'
            echo ">"
            echo "> \"Requires Simple Voice Chat to be installed.\""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "subtitle=VoiceGroupCleaner ${VERSION} — MC ${MIN} to ${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Publish each loader/version file to Modrinth
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish)
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          SVC_PROJECT_ID: ${{ steps.svc.outputs.id }}
          VERSION: ${{ steps.ver.outputs.version }}
          VTYPE: ${{ steps.ver.outputs.type }}
          CHANGELOG_TEXT: ${{ steps.notes.outputs.notes }}
        run: |
          FAIL=0
          for FILE in dist/*.jar; do
            BASENAME=$(basename "$FILE" .jar)
            LOADER=$(echo "$BASENAME" | sed -E 's/^vgcleaner-([a-z]+)-.*/\1/')
            MCVER=$(echo "$BASENAME" | sed -E 's/.*\+mc//')
            NAME="VoiceGroupCleaner ${VERSION} (${LOADER} ${MCVER})"
            VNUM="${VERSION}+mc${MCVER}-${LOADER}"

            DATA=$(jq -n \
              --arg name "$NAME" \
              --arg version_number "$VNUM" \
              --arg changelog "$CHANGELOG_TEXT" \
              --arg version_type "$VTYPE" \
              --arg loader "$LOADER" \
              --arg gv "$MCVER" \
              --arg project_id "$MODRINTH_PROJECT_ID" \
              --arg svc_id "$SVC_PROJECT_ID" \
              '{
                name: $name,
                version_number: $version_number,
                changelog: $changelog,
                dependencies: (if $svc_id == "" or $svc_id == "null" then [] else [{project_id: $svc_id, dependency_type: "required"}] end),
                game_versions: [$gv],
                version_type: $version_type,
                loaders: [$loader],
                featured: false,
                status: "listed",
                project_id: $project_id,
                file_parts: ["file"]
              }')

            HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "https://api.modrinth.com/v2/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -F "data=$DATA;type=application/json" \
              -F "file=@$FILE")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "OK   $LOADER  $MCVER"
            else
              echo "FAIL $LOADER  $MCVER  (HTTP $HTTP_CODE)"
              cat /tmp/resp.json
              FAIL=1
            fi
            sleep 0.3
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "One or more Modrinth uploads failed, see log above."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.jar
          generate_release_notes: true
